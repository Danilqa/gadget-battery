name: GadgetBattery
options:
  bundleIdPrefix: com.dsitdikov
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 5JJ2HBXA25
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    PROVISIONING_PROFILE_SPECIFIER: ""
    APP_GROUP: 5JJ2HBXA25.com.dsitdikov.gadgetbattery

packages:
  BatteryKit:
    path: Packages/BatteryKit

targets:
  GadgetBattery:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BatteryKit
        product: BatteryKit
      - package: BatteryKit
        product: BatterySources
      - target: GadgetBatteryWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gadget Battery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Daniil Sitdikov
        NSBluetoothAlwaysUsageDescription: Gadget Battery reads the battery level of your Bluetooth mice, keyboards and headsets.
        AppGroupIdentifier: $(APP_GROUP)
    entitlements:
      path: App/GadgetBattery.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsitdikov.gadgetbattery
        PRODUCT_NAME: Gadget Battery
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  GadgetBatteryWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
    dependencies:
      - package: BatteryKit
        product: BatteryKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Gadget Battery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GadgetBatteryWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsitdikov.gadgetbattery.widget
        PRODUCT_NAME: GadgetBatteryWidget
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SKIP_INSTALL: YES

schemes:
  GadgetBattery:
    build:
      targets:
        GadgetBattery: all
    run:
      config: Debug
    archive:
      config: Release
